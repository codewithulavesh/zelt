name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"   # triggers on v0.2.1, v0.3.0, etc.
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead of production PyPI"
        type: boolean
        default: true

jobs:
  build-and-publish:
    name: Build & Publish zelt-ai to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zelt-ai/

    permissions:
      id-token: write   # for OIDC trusted publishing (no API token needed)
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Run test suite
        run: |
          pip install -e ".[server]"
          pip install pytest pytest-cov
          pytest tests/ -v --tb=short --cov=zelt --cov-report=term-missing

      - name: Build distribution
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.test_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.test_pypi)
        uses: pypa/gh-action-pypi-publish@release/v1
